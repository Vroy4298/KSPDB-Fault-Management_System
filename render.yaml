services:
  - type: web
    name: kspdb-fault-management
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kspdb-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: kspdb-db
    databaseName: kspdb
    user: kspdb_user
    plan: free
